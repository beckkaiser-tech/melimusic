            </div>
            <div class="np-actions">
              <button id="np-like" class="pill-btn"><svg class="ic"><use href="#i-heart-o"/></svg><span>Favorite</span></button>
              <button id="np-download" class="pill-btn"><svg class="ic"><use href="#i-download"/></svg><span>Download</span></button>
              <button id="np-addpl" class="pill-btn"><svg class="ic"><use href="#i-plus"/></svg><span>Playlist</span></button>
            </div>
          </section>
          <section id="np-lyrics" class="np-pane">
            <div id="lyrics-container"><div class="lyrics-empty">No lyrics available</div></div>
          </section>
          <section id="np-karaoke" class="np-pane">
            <div id="karaoke-container">
              <div class="karaoke-title" id="karaoke-song-title">---</div>
              <div class="karaoke-artist" id="karaoke-song-artist">---</div>
              <div class="karaoke-lyrics" id="karaoke-lyrics">
                <div class="lyrics-empty">Press play and open karaoke to see lyrics</div>
              </div>
              <div class="karaoke-controls">
                <button id="karaoke-font-up" class="pill-btn" title="Bigger text">A+</button>
                <button id="karaoke-font-down" class="pill-btn" title="Smaller text">A-</button>
                <button id="karaoke-scroll-toggle" class="pill-btn active" title="Auto scroll">Auto Scroll</button>
              </div>
            </div>
          </section>
          <section id="np-queue" class="np-pane"><div id="queue-list"></div></section>
          <section id="np-related" class="np-pane"><div id="related-list" class="loading-note">Loading...</div></section>
        </div>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
  </div>

  <div id="yt-holder" style="position:fixed;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;"></div>

  <script src="/js/app.js"></script>
</body>
</html>
